name: Deploy to Fly.io
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'recipe-schema.ts'
      - 'data/canonical-ingredients.csv'
      - 'data/swap-groups.csv'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/fly.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FLY_ENABLED == 'true' }}
    concurrency:
      group: fly
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check the Fly token
        env:
          RAW_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Strip stray line breaks, spaces and quotes that sneak in when a token is pasted.
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t "' | sed 's/^FlyV1//')"
          if [ -z "$TOKEN" ]; then echo "::error::FLY_API_TOKEN secret is empty or missing"; exit 1; fi
          echo "token length after cleanup: ${#TOKEN} (raw: ${#RAW_TOKEN}), starts with: ${TOKEN:0:4}"
          echo "::add-mask::$TOKEN"
          echo "FLY_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          export FLY_API_TOKEN="$TOKEN"
          OUT="$(flyctl status -a recipe-app-susarip 2>&1)" || { echo "$OUT" | tail -n 5 | sed 's/^/::error::fly status: /'; exit 1; }
          echo "token works: $(echo "$OUT" | head -n 3 | tr '\n' ' ')"
      - name: Deploy
        run: |
          set -o pipefail
          flyctl deploy --remote-only 2>&1 | tee deploy.log || { tail -n 15 deploy.log | sed 's/^/::error::deploy: /'; exit 1; }
